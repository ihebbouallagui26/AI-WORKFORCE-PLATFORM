name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-api:
    name: Core API (Maven + Testcontainers)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/core-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Unit, web, architecture and integration tests (real PostgreSQL 18 + pgvector, Mailpit and
      # Keycloak 26.8.2 containers). Integration tests are not skipped: Docker is available here.
      - name: Build and test
        run: ./mvnw -B -ntp verify
      - name: OpenAPI contract is up to date
        working-directory: .
        run: |
          if ! diff -u contracts/openapi/core-api.v1.json services/core-api/target/openapi/core-api.v1.json; then
            echo "::error::contracts/openapi/core-api.v1.json differs from the generated contract. Copy services/core-api/target/openapi/core-api.v1.json and commit it."
            exit 1
          fi
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-api-test-reports
          path: services/core-api/target/surefire-reports
          retention-days: 7

  desktop:
    name: Desktop (Electron + Angular)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # The Electron binary is not needed to compile and unit-test the main process.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/desktop/ui/package-lock.json
      - name: Install
        run: |
          npm ci --prefix apps/desktop
          npm ci --prefix apps/desktop/ui
      - name: Electron main-process tests (OIDC, loopback, storage, IPC surface)
        run: npm --prefix apps/desktop run electron:test
      - name: Electron build
        run: npm --prefix apps/desktop run electron:build
      - name: Angular tests
        run: npm --prefix apps/desktop/ui test -- --watch=false
      - name: Angular production build
        run: npm --prefix apps/desktop/ui run build

  orchestrator:
    name: AI Orchestrator (Python + PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/ai-orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install (locked, pinned)
        run: |
          pip install uv==0.13.8
          uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      # Mocked providers, Testcontainers PostgreSQL and a local stdio MCP server: no real API key is used.
      # Live provider smoke tests are skipped unless AIO_LIVE_PROVIDER_TESTS=1 (never set in CI).
      - name: Tests
        run: uv run pytest -q

  security:
    name: Security checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: No local environment file or private key is tracked
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|dev|prod)$|\.pem$|\.p12$|\.jks$|id_rsa' || true)
          if [ -n "$tracked" ]; then echo "::error::Sensitive files are tracked:"; echo "$tracked"; exit 1; fi
      - name: No client secret or token storage in the desktop application
        run: |
          if grep -rniE 'client_secret|clientSecret' apps/desktop/electron/src apps/desktop/ui/src; then
            echo "::error::The desktop client is public: it must not contain a client secret."; exit 1
          fi
          if grep -rnE 'localStorage\.setItem\([^)]*(token|Token)' apps/desktop/ui/src; then
            echo "::error::Tokens must never be stored in localStorage."; exit 1
          fi
      - name: Keycloak realm keeps the desktop client public with PKCE S256
        run: |
          node -e '
            const realm = require("./infra/keycloak/realm/ai-workforce-realm.json");
            const c = realm.clients.find((x) => x.clientId === "ai-workforce-desktop");
            const ok = c && c.publicClient === true && c.implicitFlowEnabled === false &&
              c.directAccessGrantsEnabled === false && c.attributes["pkce.code.challenge.method"] === "S256" &&
              JSON.stringify(c.redirectUris) === JSON.stringify(["http://127.0.0.1/callback"]) &&
              !JSON.stringify(realm).includes("\"secret\"") && !(realm.users && realm.users.length);
            if (!ok) { console.error("Realm client policy violated"); process.exit(1); }'
      - name: Dependency audit (runtime dependencies)
        run: |
          npm audit --prefix apps/desktop --omit=dev --audit-level=high
          npm audit --prefix apps/desktop/ui --omit=dev --audit-level=high
