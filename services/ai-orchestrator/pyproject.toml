[project]
name = "ai-orchestrator"
version = "0.1.0"
description = "AI Workforce Platform - AI orchestration engine (Phase C0 foundation)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi==0.162.7",
    "uvicorn==0.54.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "httpx==0.28.1",
    "structlog==26.1.0",
    "langgraph==1.2.21",
    "langgraph-checkpoint-postgres==3.2.0",
    "langchain-core==1.8.0",
    "psycopg[binary,pool]==3.3.9",
    "mcp==2.3.0",
    "pyjwt[crypto]==2.15.1",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "respx==0.23.1",
    "testcontainers[postgres]==4.15.0",
    "ruff==0.17.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live_provider: real provider connectivity (opt-in, never runs in CI)", "docker: needs Docker (Testcontainers)"]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S603", "S607", "E501", "S608"]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
