# Base configuration, safe for production. Profiles: dev, test, prod.
# Every environment-dependent or secret value comes from environment variables.
spring:
  application:
    name: core-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ai_workforce}
    # No defaults: the application must not start with implicit credentials.
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: core-api-pool
      maximum-pool-size: 10
      # Milliseconds (HikariCP does not accept duration strings).
      connection-timeout: 10000
      # The PostgreSQL driver otherwise uses the JVM default time zone of the host:
      # every session (including Flyway's) works in UTC regardless of where the API runs.
      connection-init-sql: SET TIME ZONE 'UTC'

  jpa:
    # The schema is owned by Flyway; Hibernate only validates it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true

  jackson:
    time-zone: UTC

  autoconfigure:
    # Prevents Spring Boot from creating an in-memory user with a generated password.
    # Authentication is implemented in Sprint B1; until then no credentials exist at all.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
  info:
    build:
      enabled: true
    env:
      enabled: false
    java:
      enabled: false
    os:
      enabled: false

app:
  cors:
    # Required in every environment. Exact origins only (no wildcard).
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}

springdoc:
  # Disabled by default; enabled in the dev profile only.
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
  paths-to-match: /api/**
  default-produces-media-type: application/json

logging:
  # Every log line carries the request correlation id (see RequestIdFilter).
  pattern:
    correlation: "[%X{requestId:-}] "
  level:
    root: INFO
    com.aiworkforce.core: INFO
    org.hibernate.SQL: WARN
