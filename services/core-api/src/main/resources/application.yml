# Base configuration, safe for production. Profiles: dev, test, prod.
# Every environment-dependent or secret value comes from environment variables.
spring:
  application:
    name: core-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ai_workforce}
    # Runtime role: data access only (no DDL). No defaults: the application must not start
    # with implicit credentials. See infra/docker/postgres/init-roles.sh.
    username: ${DB_APP_USERNAME}
    password: ${DB_APP_PASSWORD}
    hikari:
      pool-name: core-api-pool
      maximum-pool-size: 10
      # Milliseconds (HikariCP does not accept duration strings).
      connection-timeout: 10000
      # The PostgreSQL driver otherwise uses the JVM default time zone of the host:
      # every session (including Flyway's) works in UTC regardless of where the API runs.
      connection-init-sql: SET TIME ZONE 'UTC'

  jpa:
    # The schema is owned by Flyway; Hibernate only validates it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    # Migrations run with a dedicated role that owns the schema (DDL); the runtime pool never does.
    user: ${DB_MIGRATION_USERNAME}
    password: ${DB_MIGRATION_PASSWORD}
    init-sqls: SET TIME ZONE 'UTC'
    placeholders:
      app_role: ${DB_APP_USERNAME}

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:25}

  jackson:
    time-zone: UTC

  autoconfigure:
    # Prevents Spring Boot from creating an in-memory user with a generated password:
    # the only authentication mechanism is the OAuth 2.0 bearer token (see SecurityConfig).
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

management:
  health:
    mail:
      # SMTP only affects invitations (they answer 503 when it is down): it must not make the
      # whole API unready.
      enabled: false
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
  info:
    build:
      enabled: true
    env:
      enabled: false
    java:
      enabled: false
    os:
      enabled: false

app:
  cors:
    # Required in every environment. Exact origins only (no wildcard).
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  security:
    oidc:
      # Required: tokens must come from this issuer and target this audience.
      issuer: ${OIDC_ISSUER:}
      jwk-set-uri: ${OIDC_JWK_SET_URI:}
      audience: ${OIDC_AUDIENCE:}
  orchestrator:
    # Keycloak client id of the AI orchestrator service account (azp claim): accepted on /api/v1/internal/** only.
    client-id: ${ORCHESTRATOR_CLIENT_ID:ai-orchestrator}
  secrets:
    # Master key of the secret store (AES-256, 32 random bytes, base64). Required, no default:
    # generate with `openssl rand -base64 32`. Never commit it.
    master-key: ${SECRETS_MASTER_KEY:}
  providers:
    # Fixed official endpoints (server-side configuration, never user input).
    timeout: 10s
    anthropic:
      base-url: https://api.anthropic.com
    openai:
      base-url: https://api.openai.com
    gemini:
      base-url: https://generativelanguage.googleapis.com
  invitations:
    ttl: 7d
    mail-from: ${INVITATION_MAIL_FROM:no-reply@aiworkforce.local}

springdoc:
  # Disabled by default; enabled in the dev profile only.
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
  paths-to-match: /api/**
  default-produces-media-type: application/json

logging:
  # Every log line carries the request correlation id (see RequestIdFilter).
  pattern:
    correlation: "[%X{requestId:-}] "
  level:
    root: INFO
    com.aiworkforce.core: INFO
    org.hibernate.SQL: WARN
